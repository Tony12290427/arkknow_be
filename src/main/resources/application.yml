server:
  port: 8080

spring:
  application:
    name: arkknow
  datasource:
    url: jdbc:mysql://localhost:3306/arkknow?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
  elasticsearch:
    uris: http://localhost:9200
  autoconfigure:
    exclude:
  ai:
    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: arknow-rag-index
    openai:
      api-key: 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
      embedding:
        api-key: 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
    deepseek:
      api-key: sk-5627012ffbe14260b0c9e290c0293315
      base-url: https://api.deepseek.com

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.arknow
  configuration:
    map-underscore-to-camel-case: true

auth:
  jwt:
    issuer: arkknow
    key-id: arkknow-key
    private-key: classpath:keys/private.pem
    public-key: classpath:keys/public.pem
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  verification:
    code-length: 6
    ttl: 5m
    max-attempts: 5
    send-interval: 60s
    daily-limit: 10
  password:
    bcrypt-strength: 12
    min-length: 8

cache:
  page-ttl: 60
  fragment-ttl: 120
  local-ttl: 30
  local-max-size: 500

  hotkey:
    window-seconds: 60
    segment-seconds: 10
    level-low: 50
    level-medium: 200
    level-high: 500
    extend-low-seconds: 20
    extend-medium-seconds: 60
    extend-high-seconds: 120

oss:
  endpoint: oss-cn-hangzhou.aliyuncs.com
  access-key-id: fake-dev-key
  access-key-secret: fake-dev-secret
  bucket-name: arkknow-dev

canal:
  enabled: false
  host: localhost
  port: 11111
  destination: example
  username: ""
  password: ""
  filter: "outbox\\..*"
  batchSize: 1000
  intervalMs: 500
